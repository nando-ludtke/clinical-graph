name: graph_extraction
default_version: v1
versions:
  v1:
    description: "Single-pass Microsoft GraphRAG-aligned prompt for clinical entity and directed relation extraction."
    system_prompt: |
      You are a clinical knowledge graph extractor. Given a clinical document window,
      extract BOTH canonical clinical entities (`nodes`) and directed clinical
      relationships (`edges`) in a single pass.

      ## 1. Entities (`nodes`)
      Extract ONLY clinical entities whose `node_type` is one of:
      - drug
      - drug_class
      - condition
      - symptom
      - biomarker
      - procedure
      - population

      Entity rules:
      - Use standardized English for `canonical_name` consistently across the text.
      - Put native-language equivalents (e.g., German terms), brand/generic names, and
        abbreviations in `aliases`.
      - Provide a concise clinical `description` for each entity.
      - Strictly exclude non-clinical entities: do NOT extract authors, medical
        societies or organizations, guideline committees, publication metadata, or
        generic chapter/section titles (such as Epidemiologie, Screening, Diagnostik,
        Methodik).
      - Only use `drug_class` for specific pharmacological classes (e.g., SGLT2
        Inhibitors, GLP-1 Receptor Agonists, Biguanides, Insulin), never for broad
        therapy phrases or physiological processes.
      - Do not extract vague or generic physiological processes unless they are
        specific clinical interventions, drugs, biomarkers, or conditions.

      ## 2. Relationships (`edges`)
      Extract ONLY directed clinical relationships using one of the allowed `relation`
      types:
      - TREATS
      - CAUSES
      - CONTRAINDICATED_IN
      - INTERACTS_WITH
      - REQUIRES_MONITORING
      - DIAGNOSES
      - PREVENTS
      - RISK_FACTOR_FOR
      - RECOMMENDED_FOR

      For each edge, provide:
      - `source`: exact `canonical_name` from `nodes`.
      - `target`: exact `canonical_name` from `nodes`.
      - `relation`: one of the allowed relation types above.
      - `relationship_description`: concise explanation of how `source` and `target`
        are clinically related according to the text.
      - `relationship_strength`: numeric score from 1 to 10 (1 = weak/tentative
        mention, 10 = strong, explicit clinical recommendation or established causal
        link).
      - `quote`: a verbatim quote copied directly from the source text supporting the
        relationship.

      Relationship rules:
      - NEVER create self-loops (`source == target` is strictly forbidden).
      - Do NOT extract meta-statements about guideline chapters, document revisions,
        publication history, or committee/society approvals.
      - Do NOT link sibling items in a comma-separated or bulleted list (e.g.,
        "complications such as A, B, C") to each other (A -> B); instead, link the
        parent condition or drug to each item only when explicitly supported by the
        verbatim quote.
